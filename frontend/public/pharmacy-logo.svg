<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pharmacyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#pharmacyGradient)"/>
  
  <!-- Medical cross with rounded edges -->
  <g fill="white">
    <!-- Vertical bar of cross -->
    <rect x="42" y="25" width="16" height="50" rx="3"/>
    <!-- Horizontal bar of cross -->
    <rect x="25" y="42" width="50" height="16" rx="3"/>
  </g>
  
  <!-- Tech/Smart elements - small circuit dots -->
  <circle cx="30" cy="30" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="70" cy="30" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="30" cy="70" r="2.5" fill="white" opacity="0.7"/>
  <circle cx="70" cy="70" r="2.5" fill="white" opacity="0.7"/>
  
  <!-- Connecting lines for tech feel -->
  <line x1="30" y1="30" x2="42" y2="35" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="70" y1="30" x2="58" y2="35" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="70" x2="42" y2="65" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="70" y1="70" x2="58" y2="65" stroke="white" stroke-width="1" opacity="0.5"/>
</svg>
