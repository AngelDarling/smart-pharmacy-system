<!DOCTYPE html>
<html>
<head>
    <title>VNPay Return Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .param {
            padding: 10px;
            margin: 5px 0;
            background: #f0f0f0;
            border-left: 3px solid #007bff;
        }
        .param strong {
            color: #007bff;
        }
        h1 {
            color: #333;
        }
        .url {
            background: #fff3cd;
            padding: 15px;
            border-radius: 5px;
            word-break: break-all;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>VNPay Return URL Debug</h1>
    
    <div class="url">
        <strong>Full URL:</strong><br>
        <span id="fullUrl"></span>
    </div>

    <h2>Query Parameters:</h2>
    <div id="params"></div>

    <script>
        // Display full URL
        document.getElementById('fullUrl').textContent = window.location.href;

        // Parse and display all query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const paramsDiv = document.getElementById('params');

        if (urlParams.toString() === '') {
            paramsDiv.innerHTML = '<div class="param">No query parameters found!</div>';
        } else {
            urlParams.forEach((value, key) => {
                const div = document.createElement('div');
                div.className = 'param';
                div.innerHTML = `<strong>${key}:</strong> ${value}`;
                paramsDiv.appendChild(div);
            });
        }

        // Log to console
        console.log('Full URL:', window.location.href);
        console.log('Query Parameters:', Object.fromEntries(urlParams));
    </script>
</body>
</html>
